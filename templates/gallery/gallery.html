{% load static %}

<!DOCTYPE html>
<html>
<head>
  <title>Galaxy Gallery</title>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Consolata University</title>
  <meta name="description" content="">
  <meta name="keywords" content="">

  <!-- Favicons -->
  <!-- <link href="{% static 'assets2/img/favicon.png' %}" rel="icon">
  <link href="{% static 'assets2/img/apple-touch-icon.png' %}" rel="apple-touch-icon"> -->

  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon/favicon-32x32.png' %}">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'assets2/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets2/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets2/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'assets2/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets2/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

  <!-- Add these in your <head> -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css"/>
  <link href="{% static 'assets2/css/main.css' %}" rel="stylesheet">
  <link href="{% static 'css/conso_css.css' %}" rel="stylesheet">
  <style>
    body { background: #000; color: #fff; }
    .swiper {
        width: 100%;
        height: 100vh;
    }
    .swiper-slide {
        background-position: center;
        background-size: cover;
    }
    .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .caption {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 15px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        text-align: center;
        font-size: 1.2em;
    }
  </style>
</head>
<body>
    <!-- 🔝 TOP BAR -->
    <div class="top-bar custom-top-bar" style="background-color: #ae1f23; color: white;">
      <div class="container-fluid d-flex justify-content-between align-items-center small px-3">
        
        <!-- Left Links -->
        <div class="d-flex flex-wrap gap-4">
          <a href="{% url 'home:home' %}" class="text-white text-decoration-none">Home</a>
          <a href="" class="text-white text-decoration-none">Language Center Gallery</a>
          <a href="" class="text-white text-decoration-none">School Of Philosophy Gallery</a>
          <a href="" class="text-white text-decoration-none">Counselling Psychology Gallery</a>
        </div>
    
        <!-- Right Social Icons -->
        <div class="d-flex gap-3">
          <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white"><i class="bi bi-twitter"></i></a>
          <a href="#" class="text-white"><i class="bi bi-envelope"></i></a>
        </div>
    
      </div>
    </div>
    
    
    
      
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      {% for photo in photos %}
        <div class="swiper-slide">
          <img src="{{ photo.image.url }}" alt="{{ photo.caption }}">
          <div class="caption">
            {{ photo.caption }}
          </div>
        </div>
      {% endfor %}
    </div>
    <!-- Navigation -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      spaceBetween: 30,
      effect: "fade",
      loop: true,
      autoplay: {
        delay: 2500,
        disableOnInteraction: false,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</body>
</html>
